<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect 4 AI</title>
<style>
/* ---------- Theme ---------- */
:root {
  --bg: #E8EDF1;
  --ink: #13202A;
  --muted: #4A5A67;
  --line: #BCC8D2;
  --board: #2F5D8A;
  --hole: #E8EDF1;
  --p1: #D1301F;   /* Red */
  --p2: #E0A21A;   /* Yellow */
  --link: #0F4C81;
  --body: "Instrument Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;

  /* keep content clear of phone notches / system bars */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Dark values, listed twice on purpose: once for the OS setting,
   once for a manual data-theme="dark" override. Keep them in sync. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101A22;
    --ink: #E6EDF2;
    --muted: #9FB0BD;
    --line: #2B3C49;
    --board: #1E4468;
    --hole: #0C141A;
    --p1: #FF5A47;
    --p2: #E8B43A;
    --link: #7DB7F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101A22;
  --ink: #E6EDF2;
  --muted: #9FB0BD;
  --line: #2B3C49;
  --board: #1E4468;
  --hole: #0C141A;
  --p1: #FF5A47;
  --p2: #E8B43A;
  --link: #7DB7F0;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }  /* needed because label uses display:flex */

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--body);
}
main { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
h1 { margin: 0; font-size: 2rem; letter-spacing: -.02em; }
.sub { margin: .25rem 0 1.25rem; color: var(--muted); }

/* ---------- Controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-bottom: 1rem; }
label { display: flex; flex-direction: column; gap: .2rem; font-size: .85rem; color: var(--muted); }

select, .btn {
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--ink);
  border-radius: 10px;
  padding: .45rem .7rem;
  min-height: 2.5rem;
}
.btn { cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--ink); color: var(--bg); }
.file-button { flex-direction: row; }  /* the "Load model" label styled as a button */

/* real file input is visually hidden; its label acts as the button */
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
input[type=file]:focus-visible + .btn,
select:focus-visible, .btn:focus-visible, .col:focus-visible {
  outline: 3px solid var(--link);
  outline-offset: 3px;
}

.model { margin: 0 0 1rem; font-size: .9rem; color: var(--muted); }
.status { margin: 0 0 .75rem; font-size: 1.15rem; font-weight: 600; min-height: 1.75rem; }
.dot { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: .4em; }

/* ---------- Board ---------- */
.board {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 8px;
  background: var(--board);
  border-radius: 16px;
}
.col {                       /* one clickable button per column */
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
}
.col:not(:disabled):hover { background: rgba(255, 255, 255, .14); }
.col:disabled { cursor: default; }

.cell { display: block; width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--hole); }
.cell.p1 { background: var(--p1); }
.cell.p2 { background: var(--p2); }
.cell.last { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .6); }
.cell.win { outline: 3px solid var(--ink); outline-offset: 2px; }

/* ---------- AI Q-values under the board ---------- */
.qrow {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: .4rem 8px 0;
  text-align: center;
  font-size: .8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.qcap { margin: .25rem 0 0; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Connect 4 AI</h1>
  <p class="sub">Play a friend, or play the neural network from my self-play training.</p>

  <div class="controls">
    <label>Mode
      <select id="mode">
        <option value="pvp">Two players</option>
        <option value="ai">Play the AI</option>
      </select>
    </label>
    <label id="sideLabel">I play
      <select id="side">
        <option value="1">Red</option>
        <option value="2">Yellow</option>
      </select>
    </label>
    <label>Moves first
      <select id="first">
        <option value="1">Red</option>
        <option value="2">Yellow</option>
      </select>
    </label>
    <button class="btn" id="new" type="button">New game</button>
    <span>
      <input type="file" id="file" accept=".pth,.pt,.json">
      <label for="file" class="btn file-button">Load model</label>
    </span>
  </div>
  <p class="model" id="model">AI model: not loaded. Click “Load model” and pick a file with the .pth extension.</p>

  <p class="status" id="status" aria-live="polite"></p>
  <div class="board" id="board"></div>
  <div class="qrow" id="qrow" hidden></div>
  <p class="qcap" id="qcap" hidden>The AI’s Q-value for each column on its last move. Higher means it likes the move more.</p>
</main>

<script>
(() => {
  /* =====================================================================
     Constants
     ===================================================================== */
  const ROWS = 6;
  const COLS = 7;
  const AI_DELAY_MS = 400;
  const DIRECTIONS = [[0, 1], [1, 0], [1, 1], [1, -1]];  // → ↓ ↘ ↗

  // The PyTorch network: 42 inputs (the board) -> 128 -> 48 -> 7 outputs (one Q-value per column)
  const NETWORK = [
    { name: 'linear_relu_stack.0', outputs: 128, inputs: 42 },
    { name: 'linear_relu_stack.2', outputs: 48,  inputs: 128 },
    { name: 'linear_relu_stack.4', outputs: 7,   inputs: 48 },
  ];

  /* =====================================================================
     State
     ===================================================================== */
  let board;          // board[row][col]: 0 = empty, 1 = red, 2 = yellow (row 0 is the top)
  let turn;           // player to move (1 or 2)
  let gameOver;
  let mode;           // 'pvp' or 'ai'
  let humanPlayer;    // which colour the human plays in 'ai' mode
  let lastMove;       // [row, col] of the most recent piece, or null
  let winningCells;   // [[row, col], ...] of the winning line, or []
  let qValues;        // network output from the AI's last move, or null
  let aiThinking;     // true during the short delay before the AI moves
  let aiTimer;
  let model = null;   // loaded weights, e.g. model['linear_relu_stack.0.weight']

  const $ = id => document.getElementById(id);
  const columnButtons = [];
  const cells = [];   // cells[col][row] -> DOM element

  /* =====================================================================
     Small helpers
     ===================================================================== CMPUT 274 for the win lol*/
  const emptyBoard = () => Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  const canPlay = () => !(mode === 'ai' && !model);       // AI mode needs a loaded model
  const isAiTurn = () => mode === 'ai' && turn !== humanPlayer;
  const playerName = player => (player === 1 ? 'Red' : 'Yellow');
  const dotHtml = player => `<span class="dot" style="background:var(--p${player})"></span>`;
  const inBounds = (row, col) => row >= 0 && row < ROWS && col >= 0 && col < COLS;

  /* =====================================================================
     Game logic
     ===================================================================== */
  function newGame() {
    clearTimeout(aiTimer);   // cancel any AI move still pending from the previous game
    board = emptyBoard();
    turn = +$('first').value;
    gameOver = false;
    lastMove = null;
    winningCells = [];
    qValues = null;
    aiThinking = false;
    mode = $('mode').value;
    humanPlayer = +$('side').value;
    $('sideLabel').hidden = mode !== 'ai';
    render();
    scheduleAiMove();
  }

  // Drops a piece in a column; returns the row it landed in, or -1 if the column is full.
  function dropPiece(col, player) {
    for (let row = ROWS - 1; row >= 0; row--) {
      if (board[row][col] === 0) {
        board[row][col] = player;
        return row;
      }
    }
    return -1;
  }

  // Returns every connected cell in a line of 4+ through (row, col), or null.
  function findWinningLine(row, col) {
    const player = board[row][col];
    for (const [dRow, dCol] of DIRECTIONS) {
      const line = [[row, col]];
      for (const sign of [-1, 1]) {
        let r = row + sign * dRow;
        let c = col + sign * dCol;
        while (inBounds(r, c) && board[r][c] === player) {
          line.push([r, c]);
          r += sign * dRow;
          c += sign * dCol;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  function play(col) {
    const row = dropPiece(col, turn);
    if (row < 0) return;
    lastMove = [row, col];

    const line = findWinningLine(row, col);
    if (line) {
      gameOver = true;
      winningCells = line;
    } else if (board[0].every(cell => cell !== 0)) {
      gameOver = true;                // board full: draw
    } else {
      turn = 3 - turn;                // switch between 1 and 2
    }
    render();
    scheduleAiMove();
  }

  function onColumnClick(col) {
    if (gameOver || aiThinking || !canPlay() || isAiTurn()) return;
    play(col);
  }

  /* =====================================================================
     The AI
     ===================================================================== */

  // Board as the network sees it: 1 = my piece, -1 = opponent's, 0 = empty (row by row).
  function boardAsInput(player) {
    return board.flat().map(v => (v === 0 ? 0 : v === player ? 1 : -1));
  }

  function applyLayer(weights, biases, input, useRelu) {
    return weights.map((row, i) => {
      const sum = row.reduce((total, w, j) => total + w * input[j], biases[i]);
      return useRelu ? Math.max(0, sum) : sum;
    });
  }

  // ReLU after every layer except the last.
  function runNetwork(input) {
    return NETWORK.reduce((x, layer, i) => applyLayer(
      model[layer.name + '.weight'],
      model[layer.name + '.bias'],
      x,
      i < NETWORK.length - 1
    ), input);
  }

  function aiMove() {
    qValues = runNetwork(boardAsInput(3 - humanPlayer));

    let best = -1;                    // best non-full column; ties go to the leftmost
    for (let col = 0; col < COLS; col++) {
      if (board[0][col] !== 0) continue;
      if (best < 0 || qValues[col] > qValues[best]) best = col;
    }
    play(best);
  }

  function scheduleAiMove() {
    if (!isAiTurn() || !model || gameOver) return;
    aiThinking = true;
    render();
    aiTimer = setTimeout(() => {
      aiThinking = false;
      aiMove();
    }, AI_DELAY_MS);
  }

  /* =====================================================================
     Rendering
     ===================================================================== */
  function buildBoard() {
    for (let col = 0; col < COLS; col++) {
      const button = document.createElement('button');
      button.className = 'col';
      button.type = 'button';
      button.setAttribute('aria-label', 'Drop in column ' + (col + 1));
      button.addEventListener('click', () => onColumnClick(col));

      cells[col] = [];
      for (let row = 0; row < ROWS; row++) {
        const cell = document.createElement('span');
        cell.className = 'cell';
        button.appendChild(cell);
        cells[col][row] = cell;
      }
      $('board').appendChild(button);
      columnButtons[col] = button;

      $('qrow').appendChild(document.createElement('span'));   // one Q-value slot per column
    }
  }

  function renderBoard() {
    const isWinning = (row, col) => winningCells.some(([r, c]) => r === row && c === col);

    for (let col = 0; col < COLS; col++) {
      columnButtons[col].disabled =
        gameOver || aiThinking || !canPlay() || isAiTurn() || board[0][col] !== 0;

      for (let row = 0; row < ROWS; row++) {
        const cell = cells[col][row];
        cell.className = 'cell';
        if (board[row][col]) cell.classList.add('p' + board[row][col]);
        if (lastMove && lastMove[0] === row && lastMove[1] === col) cell.classList.add('last');
        if (isWinning(row, col)) cell.classList.add('win');
      }
    }
  }

  function statusHtml() {
    if (!canPlay()) return 'Load a model file to play the AI.';

    if (gameOver && winningCells.length) {
      const [row, col] = winningCells[0];
      const winner = board[row][col];
      const text = mode === 'ai'
        ? (winner === humanPlayer ? 'You win!' : 'The AI wins.')
        : playerName(winner) + ' wins!';
      return dotHtml(winner) + text;
    }
    if (gameOver) return 'Draw.';

    if (mode === 'ai') {
      return dotHtml(turn) + (turn === humanPlayer ? 'Your turn' : 'The AI is thinking…');
    }
    return dotHtml(turn) + playerName(turn) + '’s turn';
  }

  function renderQValues() {
    const show = mode === 'ai' && qValues;
    $('qrow').hidden = !show;
    $('qcap').hidden = !show;
    if (!show) return;

    [...$('qrow').children].forEach((span, col) => {
      span.textContent = board[0][col] !== 0 ? '–' : qValues[col].toFixed(2);
    });
  }

  function render() {
    renderBoard();
    $('status').innerHTML = statusHtml();
    renderQValues();
  }

  /* =====================================================================
     Loading a model (.pth saved by PyTorch, or a .json of the same weights)

     A .pth is an uncompressed zip containing a Python pickle (data.pkl) that
     describes the tensors, plus one raw binary file per tensor. There is no
     library for this in the browser, so we read both formats by hand.
     ===================================================================== */

  // Step 1: unzip. Returns { filename: Uint8Array } (only uncompressed zips are supported).
  function readZipEntries(bytes) {
    if (bytes[0] !== 0x50 || bytes[1] !== 0x4b) throw new Error('not a zip-format .pth');

    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const decoder = new TextDecoder();

    // Find the "end of central directory" record by scanning backwards.
    let end = bytes.length - 22;
    while (end >= 0 && view.getUint32(end, true) !== 0x06054b50) end--;
    if (end < 0) throw new Error('bad zip');

    const entryCount = view.getUint16(end + 10, true);
    let pos = view.getUint32(end + 16, true);     // start of the central directory
    const files = {};

    for (let i = 0; i < entryCount; i++) {
      const method      = view.getUint16(pos + 10, true);
      const size        = view.getUint32(pos + 20, true);
      const nameLength  = view.getUint16(pos + 28, true);
      const extraLength = view.getUint16(pos + 30, true);
      const commentLen  = view.getUint16(pos + 32, true);
      const localHeader = view.getUint32(pos + 42, true);
      const name = decoder.decode(bytes.subarray(pos + 46, pos + 46 + nameLength));

      if (method !== 0) throw new Error('compressed zip');
      const dataStart = localHeader + 30
        + view.getUint16(localHeader + 26, true)
        + view.getUint16(localHeader + 28, true);
      files[name] = bytes.subarray(dataStart, dataStart + size);

      pos += 46 + nameLength + extraLength + commentLen;
    }
    return files;
  }

  // Step 2: run a tiny pickle interpreter, supporting only the opcodes PyTorch uses.
  // Returns the saved state_dict as a Map of name -> tensor description.
  const OP = {
    PROTO: 0x80, FRAME: 0x95, STOP: 0x2e, MARK: 0x28, BUILD: 0x62,
    GLOBAL: 0x63, STACK_GLOBAL: 0x93, REDUCE: 0x52, BINPERSID: 0x51,
    BINPUT: 0x71, LONG_BINPUT: 0x72, MEMOIZE: 0x94, BINGET: 0x68, LONG_BINGET: 0x6a,
    EMPTY_TUPLE: 0x29, TUPLE: 0x74, TUPLE1: 0x85, TUPLE2: 0x86, TUPLE3: 0x87,
    EMPTY_LIST: 0x5d, APPEND: 0x61, APPENDS: 0x65,
    EMPTY_DICT: 0x7d, SETITEM: 0x73, SETITEMS: 0x75,
    BINUNICODE: 0x58, SHORT_BINUNICODE: 0x8c,
    BININT1: 0x4b, BININT2: 0x4d, BININT: 0x4a, LONG1: 0x8a,
    NEWTRUE: 0x88, NEWFALSE: 0x89, NONE: 0x4e,
  };

  function readPickle(data) {
    const decoder = new TextDecoder();
    const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
    const stack = [];
    const marks = [];     // stack positions recorded by MARK
    const memo = [];      // values saved by PUT/MEMOIZE, fetched later by GET
    let nextMemo = 0;
    let pos = 0;

    const top = () => stack[stack.length - 1];
    const popN = n => stack.splice(stack.length - n);
    const popToMark = () => stack.splice(marks.pop());
    const readUint32 = () => { const v = view.getUint32(pos, true); pos += 4; return v; };
    const readText = length => { const s = decoder.decode(data.subarray(pos, pos + length)); pos += length; return s; };
    const readLine = () => {
      const start = pos;
      while (data[pos] !== 10) pos++;
      return decoder.decode(data.subarray(start, pos++));
    };

    while (true) {
      switch (data[pos++]) {
        // --- bookkeeping ---
        case OP.PROTO:  pos += 1; break;
        case OP.FRAME:  pos += 8; break;
        case OP.STOP:   return stack.pop();
        case OP.MARK:   marks.push(stack.length); break;
        case OP.BUILD:  stack.pop(); break;                      // object state: not needed

        // --- memo ---
        case OP.BINPUT:      memo[data[pos++]] = top(); break;
        case OP.LONG_BINPUT: memo[readUint32()] = top(); break;
        case OP.MEMOIZE:     memo[nextMemo++] = top(); break;
        case OP.BINGET:      stack.push(memo[data[pos++]]); break;
        case OP.LONG_BINGET: stack.push(memo[readUint32()]); break;

        // --- Python functions and objects ---
        case OP.GLOBAL: {
          const module = readLine();
          stack.push({ global: module + '.' + readLine() });
          break;
        }
        case OP.STACK_GLOBAL: {
          const name = stack.pop();
          const module = stack.pop();
          stack.push({ global: module + '.' + name });
          break;
        }
        case OP.REDUCE: {                                        // call fn(*args)
          const args = stack.pop();
          const fn = stack.pop();
          if (fn.global === 'collections.OrderedDict') {
            stack.push(new Map());
          } else if (/_rebuild_tensor/.test(fn.global)) {
            stack.push({ storage: args[0], offset: args[1], size: args[2] });
          } else {
            stack.push({ global: '?' });
          }
          break;
        }
        case OP.BINPERSID: {                                     // reference to a tensor's data file
          const id = stack.pop();
          stack.push({ key: id[2], type: id[1].global });
          break;
        }

        // --- tuples and lists ---
        case OP.EMPTY_TUPLE:
        case OP.EMPTY_LIST: stack.push([]); break;
        case OP.TUPLE:  stack.push(popToMark()); break;
        case OP.TUPLE1: stack.push(popN(1)); break;
        case OP.TUPLE2: stack.push(popN(2)); break;
        case OP.TUPLE3: stack.push(popN(3)); break;
        case OP.APPEND: {
          const value = stack.pop();
          if (Array.isArray(top())) top().push(value);
          break;
        }
        case OP.APPENDS: {
          const items = popToMark();
          if (Array.isArray(top())) items.forEach(v => top().push(v));
          break;
        }

        // --- dicts ---
        case OP.EMPTY_DICT: stack.push(new Map()); break;
        case OP.SETITEM: {
          const value = stack.pop();
          const key = stack.pop();
          if (top() instanceof Map) top().set(key, value);
          break;
        }
        case OP.SETITEMS: {
          const items = popToMark();
          if (top() instanceof Map) {
            for (let i = 0; i + 1 < items.length; i += 2) top().set(items[i], items[i + 1]);
          }
          break;
        }

        // --- strings, numbers, constants ---
        case OP.BINUNICODE:       stack.push(readText(readUint32())); break;
        case OP.SHORT_BINUNICODE: stack.push(readText(data[pos++])); break;
        case OP.BININT1: stack.push(data[pos++]); break;
        case OP.BININT2: stack.push(view.getUint16(pos, true)); pos += 2; break;
        case OP.BININT:  stack.push(view.getInt32(pos, true)); pos += 4; break;
        case OP.LONG1: {
          const length = data[pos++];
          let value = 0;
          for (let k = length - 1; k >= 0; k--) value = value * 256 + data[pos + k];
          pos += length;
          stack.push(value);
          break;
        }
        case OP.NEWTRUE:  stack.push(true); break;
        case OP.NEWFALSE: stack.push(false); break;
        case OP.NONE:     stack.push(null); break;

        default: throw new Error('unsupported pickle op ' + data[pos - 1]);
      }
    }
  }

  // turn each tensor description into plain nested arrays, using its raw data file.
  function tensorsToArrays(stateDict, files, folder) {
    const weights = {};
    stateDict.forEach((tensor, name) => {
      if (!tensor || !tensor.storage) return;                    // skip non-tensor entries

      const raw = files[folder + 'data/' + tensor.storage.key].slice();   // copy so the buffer is aligned
      const values = /Double/.test(tensor.storage.type)
        ? new Float64Array(raw.buffer)
        : new Float32Array(raw.buffer);

      const { offset, size } = tensor;
      if (size.length === 1) {                                   // bias vector
        weights[name] = Array.from(values.subarray(offset, offset + size[0]));
      } else {                                                   // weight matrix
        const [rows, cols] = size;
        weights[name] = Array.from({ length: rows }, (_, r) =>
          Array.from(values.subarray(offset + r * cols, offset + (r + 1) * cols)));
      }
    });
    return weights;
  }

  function parsePth(bytes) {
    const files = readZipEntries(bytes);
    const pickleName = Object.keys(files).find(name => /(^|\/)data\.pkl$/.test(name));
    if (!pickleName) throw new Error('no data.pkl');

    const stateDict = readPickle(files[pickleName]);
    if (!(stateDict instanceof Map)) throw new Error('not a state_dict');

    const folder = pickleName.slice(0, -'data.pkl'.length);       // e.g. "archive/"
    return tensorsToArrays(stateDict, files, folder);
  }

  // Check the loaded weights have the shapes NETWORK expects.
  function isValidModel(weights) {
    return NETWORK.every(({ name, outputs, inputs }) => {
      const W = weights[name + '.weight'];
      const b = weights[name + '.bias'];
      return Array.isArray(W) && Array.isArray(b)
        && W.length === outputs && b.length === outputs
        && Array.isArray(W[0]) && W[0].length === inputs;
    });
  }

  /* =====================================================================
     Events and startup
     ===================================================================== */
  $('file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const weights = /\.json$/i.test(file.name)
          ? JSON.parse(new TextDecoder().decode(reader.result))
          : parsePth(new Uint8Array(reader.result));
        if (!isValidModel(weights)) throw new Error('bad shape');

        model = weights;
        $('model').textContent = `AI model: loaded (${file.name}).`;
        $('mode').value = 'ai';
      } catch (err) {
        $('model').textContent =
          'Couldn’t read that file. Use the connect4_model.pth saved by your script (network 42, 128, 48, 7).';
      }
      newGame();
    };
    reader.readAsArrayBuffer(file);
  });

  $('new').addEventListener('click', newGame);
  ['mode', 'side', 'first'].forEach(id => $(id).addEventListener('change', newGame));

  // Keys 1–7 drop a piece in that column.
  document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= COLS) onColumnClick(n - 1);
  });

  buildBoard();
  newGame();
})();
</script>
</body>
</html>
